  Página web servida por el mismo script (doGet, Parte 1). Se abre desde el enlace de la
  aplicación web, en el computador o en el celular, y se actualiza sola cada 60 s.
  Muestra la última lectura: nivel, volumen, carga de la batería, temperatura y humedad
  de la caja, indicador experimental de fuga, alarma general y los 5 sensores.
  No calcula nada por su cuenta: los cálculos los hace el script (Parte 2).
  Después de cambiar este archivo hay que publicar una "Nueva versión".

  .btn.ref.girando{animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .estado{max-width:1100px;margin:16px auto 0;display:flex;align-items:center;gap:12px;background:#ffffff18;border-radius:16px;padding:14px}

  .estado b{display:block;font-size:16px}
  .estado span{font-size:13px;color:#d6eadd}
  main{padding:18px 16px 32px;max-width:1100px;margin:0 auto}
  .oculto{display:none !important}

      border:2px solid transparent;text-align:left;font:inherit;color:inherit;width:100%;position:relative;overflow:hidden;

  /* ---- Detalle ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px #0f172a12;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--line))}
  .card h2{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
  .fila{display:flex;align-items:center;gap:16px;margin-top:10px}
  .grande{font-size:38px;font-weight:800;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
  .grande small{font-size:18px;font-weight:700}
  .nota{font-size:12.5px;color:var(--sub);margin-top:4px}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:6px;
        background:var(--cbg);color:var(--c);white-space:nowrap}
  .barra{height:10px;border-radius:6px;background:var(--line);margin-top:10px;overflow:hidden;position:relative}
  .barra i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:6px}
  .barra .lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--cr);opacity:.7}
  .sens{display:flex;flex-direction:column-reverse;gap:6px;margin-top:10px}
  .sens div{display:flex;align-items:center;gap:10px;font-size:13.5px;white-space:nowrap}
  .sens .b{width:46px;height:18px;border-radius:6px;border:2px solid var(--line)}
  .sens .b.agua{background:var(--dc);border-color:var(--dc)}
  @media (prefers-color-scheme: dark){ .sens .b.agua{background:var(--ok);border-color:var(--ok)} }
  @media (prefers-color-scheme: dark){ .stat .v{color:var(--ok)} }
  .err{background:var(--crbg);color:var(--cr);border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px;display:none}
  .pie{text-align:center;color:var(--sub);font-size:12px;margin-top:20px}
  .ultimo{font-size:14px;color:var(--sub);text-align:center;margin-top:16px}
  .ultimo b{color:var(--txt)}
  @media (max-width:520px){ .grande{font-size:32px} }

        <h1 id="titulo">Monitoreo del tanque</h1>
      </div>
      <div class="botones">
        <button class="btn ref" id="btn" onclick="cargar()" aria-label="Actualizar">⟳</button>
      </div>
    </div>
    <div class="estado">
      <div class="punto" id="punto" style="background:#94a3b8"></div>
      <div><b id="estTitulo">Cargando…</b><span id="estSub">Consultando la hoja</span></div>
    </div>
  </div>

  <main>
    <div class="err" id="err"></div>
    <div class="grid" id="tarjetas"></div>
    <div class="ultimo" id="ultimo"></div>
    <div class="pie" id="pie"></div>
  </main>
<script>

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function hhmm(ms){ var d=new Date(ms); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function fecha(ms){ var d=new Date(ms); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+hhmm(ms); }
function fechaLarga(ms){
  var d=new Date(ms), h=d.getHours(), am=h<12?'a. m.':'p. m.'; h=h%12||12;
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+' · '+h+':'+('0'+d.getMinutes()).slice(-2)+' '+am;
}
function hace(ms, ahora){
  var m = Math.max(0, Math.round((ahora-ms)/60000));
  if(m < 1) return 'ahora';
  if(m < 60) return 'hace '+m+' min';
  if(m < 1440) return 'hace '+Math.floor(m/60)+' h '+(m%60)+' min';
  return 'hace '+Math.floor(m/1440)+' d';
}
function miles(n){ return Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
var BIEN = ['var(--ok)','var(--okbg)'], AVISO = ['var(--av)','var(--avbg)'], MAL = ['var(--cr)','var(--crbg)'], GRIS = ['var(--sub)','var(--line)'];
function col(ok){ return ok==null ? GRIS : (ok ? BIEN : MAL); }
// Verde / amarillo (aviso, un poco antes de lo malo) / rojo. "alto" = true cuando lo malo es pasarse (temperatura)
function semaforo(v, malo, aviso, alto){
  if(v==null) return GRIS;
  if(alto) return v > malo ? MAL : (v > aviso ? AVISO : BIEN);
  return v < malo ? MAL : (v < aviso ? AVISO : BIEN);
}
function estadoGeneral(t, s, color){ $('estTitulo').textContent = t; $('estSub').textContent = s; $('punto').style.background = color; }

function tarjeta(titulo, c, contenido){
  return '<div class="card" style="--c:'+c[0]+';--cbg:'+c[1]+'"><h2>'+titulo+'</h2>'+contenido+'</div>';
}

// Dibujo del tanque lleno hasta "nivel" % (cada dibujo con su propio id)
var nSVG = 0;
function tanqueSVG(nivel, color){
  var id = 'cuerpo' + (nSVG++);
  var h = 92, y = 12 + h * (1 - Math.max(0, Math.min(100, nivel)) / 100);
  return '<svg width="70" height="112" viewBox="0 0 70 112" style="flex:none">'+
    '<defs><clipPath id="'+id+'"><rect x="6" y="12" width="58" height="92" rx="10"/></clipPath></defs>'+
    '<rect x="24" y="2" width="22" height="10" rx="3" fill="none" stroke="var(--sub)" stroke-width="2"/>'+
    '<rect x="6" y="'+y+'" width="58" height="'+(104-y)+'" fill="'+color+'" opacity=".85" clip-path="url(#'+id+')"/>'+
    '<rect x="6" y="12" width="58" height="92" rx="10" fill="none" stroke="var(--sub)" stroke-width="2.5"/>'+
    '</svg>';
}
function bateriaSVG(pct, color){
  var w = 60 * Math.max(0, Math.min(100, pct)) / 100;
  return '<svg width="80" height="40" viewBox="0 0 80 40" style="flex:none"><rect x="2" y="4" width="68" height="32" rx="7" fill="none" stroke="var(--sub)" stroke-width="2.5"/>'+
    '<rect x="71" y="13" width="6" height="14" rx="2" fill="var(--sub)"/>'+
    '<rect x="6" y="8" width="'+w+'" height="24" rx="4" fill="'+color+'"/></svg>';
}

/* =========================== TABLERO =========================== */
function pintar(d){
  listo();
  $('titulo').textContent = d.nombre + (d.lugar ? ' · ' + d.lugar : '');
  var u = d.ultimo, L = d.limites;

  var sinRep = !u || (d.ahora - u.t) / 60000 > d.minutosSinReporte;
  if(!u) estadoGeneral('Sin datos todavía', 'Esperando el primer envío del ESP32', '#94a3b8');
  else if(sinRep) estadoGeneral('El tanque no está reportando', 'Último dato '+fecha(u.t)+' · '+hace(u.t,d.ahora), '#ef4444');
  else if(u.alarma===0) estadoGeneral('Revisar: '+(u.mal||'alarma activa'), 'Último reporte '+hhmm(u.t)+' · '+hace(u.t,d.ahora), '#ef4444');
  else estadoGeneral('Todo en orden', 'Último reporte '+hhmm(u.t)+' · '+hace(u.t,d.ahora), '#22c55e');

  if(!u){ $('tarjetas').innerHTML=''; return; }

  // ---- Tarjetas ----
  var cNivel = semaforo(u.nivel, L.nivel, L.nivelAviso);
  var cVol = semaforo(u.vol, L.volumen, L.volumenAviso);
  var cBat = semaforo(u.bat, L.bateria, L.bateriaAviso);
  var cTemp = semaforo(u.temp, L.temp, L.tempAviso, true);
  var okFuga = u.fuga==null ? null : u.fuga === 1;
  var okAlarma = u.alarma==null ? null : u.alarma === 1;
  var k = 0; while(k < 5 && u.s[k]===1) k++;
  var ordenados = true; for(var i=k;i<5;i++) if(u.s[i]===1) ordenados = false;
  var okSens = u.s[0]==null ? null : ordenados;

  var html = '';
  html += tarjeta('Nivel del tanque', cNivel,
    '<div class="fila">'+tanqueSVG(u.nivel||0, cNivel[0])+'<div><div class="grande">'+(u.nivel==null?'—':u.nivel)+'<small>%</small></div></div></div>');
  html += tarjeta('Volumen', cVol,
    '<div class="grande" style="margin-top:12px">'+(u.vol==null?'—':miles(u.vol))+' <small>L</small></div>'+
    '<div class="nota">Capacidad '+miles(d.capacidad)+' L</div>'+
    '<div class="barra"><i style="width:'+Math.min(100,(u.vol||0)/d.capacidad*100)+'%"></i><span class="lim" style="left:'+(L.volumen/d.capacidad*100)+'%"></span></div>');
  html += tarjeta('Carga de la batería', cBat,
    '<div class="fila">'+bateriaSVG(u.bat||0, cBat[0])+'<div><div class="grande">'+(u.bat==null?'—':u.bat)+'<small>%</small></div></div></div>');
  html += tarjeta('Temperatura de la caja', cTemp,
    '<div class="grande" style="margin-top:12px">'+(u.temp==null?'—':u.temp.toFixed(1))+' <small>°C</small></div>'+
    '<div class="nota">'+(u.hum==null?'':'Humedad '+Math.round(u.hum)+' %')+(u.vent==null?'':(u.hum==null?'':' · ')+'Ventilador '+(u.vent===1?'encendido':'apagado'))+'</div>'+
    (u.temp==null?'<span class="chip">Sin lectura del sensor</span>':''));
  html += tarjeta('Detección de fuga (experimental)', col(okFuga),
    '<div class="grande" style="margin-top:12px;font-size:28px">'+(okFuga==null?'—':(okFuga?'Sin fuga':'Posible fuga'))+'</div>'+
    '<div class="nota">'+(okFuga===false?'Bajada del nivel mayor a la habitual (indicador no validado)':'Sin bajada anormal del nivel')+'</div>');
  html += tarjeta('Alarma general', col(okAlarma),
    '<div class="grande" style="margin-top:12px;font-size:28px">'+(okAlarma?'Todo en orden':'Revisar')+'</div>'+
    '<div class="nota">'+(okAlarma?'Sin alarmas activas':esc(u.mal||'Hay algo fuera de lo normal'))+'</div>');
  var sens = '';
  for(var j=0;j<5;j++){
    var agua = u.s[j]===1;
    sens += '<div><span class="b'+(agua?' agua':'')+'"></span><b>Sensor '+(j+1)+'</b><span style="color:var(--sub)">'+(u.s[j]==null?'—':(agua?'Con agua':'Sin agua'))+'</span></div>';
  }
  html += tarjeta('Sensores de nivel', col(okSens), '<div class="sens">'+sens+'</div>'+
    (ordenados?'':'<span class="chip">Lectura incoherente: revisar sensores</span>'));
  $('tarjetas').innerHTML = html;

  $('ultimo').innerHTML = 'Último reporte <b>'+fechaLarga(u.t)+'</b>';
  $('pie').textContent = 'Se actualiza solo cada minuto';
}


function listo(){ $('err').style.display = 'none'; $('btn').classList.remove('girando'); }
function fallo(e){
  $('btn').classList.remove('girando');
  var el = $('err'); el.textContent = 'No se pudo actualizar: '+(e && e.message ? e.message : e); el.style.display = 'block';
}
function cargar(){
  $('btn').classList.add('girando');
  google.script.run.withSuccessHandler(pintar).withFailureHandler(fallo).datosTablero();
}
cargar();
setInterval(cargar, 60000);
</script>
</body>
</html>
